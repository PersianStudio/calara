<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="calara">
  <!-- Binding rings -->
  <path
    d="M22 6.5c0-1.8 1.4-3.2 3.2-3.2h1.6c1.8 0 3.2 1.4 3.2 3.2v8.5H22V6.5Z"
    fill="#0969da"
  />
  <path
    d="M34 6.5c0-1.8 1.4-3.2 3.2-3.2h1.6c1.8 0 3.2 1.4 3.2 3.2v8.5H34V6.5Z"
    fill="#0969da"
  />
  <!-- Calendar body -->
  <rect x="8" y="12" width="48" height="46" rx="8" stroke="#0b1220" stroke-width="3.25" fill="#ffffff"/>
  <!-- Header bar -->
  <path d="M8 24h48" stroke="#0b1220" stroke-width="3.25" stroke-linecap="square"/>
  <!-- Month grid 7×4 -->
  <g stroke="#c8d1dc" stroke-width="1.1">
    <!-- verticals -->
    <path d="M15.4 28.5v25"/>
    <path d="M22.3 28.5v25"/>
    <path d="M29.1 28.5v25"/>
    <path d="M36 28.5v25"/>
    <path d="M42.9 28.5v25"/>
    <path d="M49.7 28.5v25"/>
    <!-- horizontals -->
    <path d="M11 34.8h42"/>
    <path d="M11 41h42"/>
    <path d="M11 47.3h42"/>
  </g>
  <!-- Selected day (row 2, col 4) -->
  <rect x="29.6" y="35.4" width="5.8" height="5.1" rx="1" fill="#0969da"/>
</svg>
